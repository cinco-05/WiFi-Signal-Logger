[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-signal-logger"
version = "1.0.0"
description = "Log Windows Wi-Fi signal strength to CSV and create useful charts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CJ Sturiale" }]
dependencies = ["matplotlib>=3.8,<4"]
keywords = ["wifi", "windows", "networking", "csv", "matplotlib", "netsh"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
wifi-signal-logger = "wifi_signal_logger.cli:main"

[tool.setuptools.packages.find]
include = ["wifi_signal_logger*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
